services:
  postgres:
    image: postgres:17
    container_name: team-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /vault/credentials/postgres-password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - vault_credentials:/vault/credentials:ro

    depends_on:
      vault-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-team_platform}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    networks:
      - backend_database

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile

    container_name: team-platform-backend
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - python -m flask --app run db upgrade heads && exec python -m flask --app run run --host=0.0.0.0 --port=5000

    environment:
      VAULT_AGENT_ADDR: http://vault-agent:8100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      FRONTEND_ORIGIN: ${WAF_PUBLIC_ORIGIN:-http://localhost:8080}
      FRONTEND_ORIGINS: ${WAF_PUBLIC_ORIGIN:-http://localhost:8080}
      MICROSOFT_REDIRECT_URI: ${WAF_PUBLIC_ORIGIN:-http://localhost:8080}/auth/microsoft/callback
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-organizations}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-14}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300 per hour}
      API_GLOBAL_RATE_LIMIT: ${API_GLOBAL_RATE_LIMIT:-1200 per hour}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MAX_CONTENT_LENGTH_BYTES: ${MAX_CONTENT_LENGTH_BYTES:-115343360}
      STORAGE_MAX_AVATAR_BYTES: ${STORAGE_MAX_AVATAR_BYTES:-5242880}
      STORAGE_MAX_PROJECT_REQUIREMENTS_BYTES: ${STORAGE_MAX_PROJECT_REQUIREMENTS_BYTES:-20971520}
      STORAGE_MAX_TASK_ATTACHMENT_BYTES: ${STORAGE_MAX_TASK_ATTACHMENT_BYTES:-26214400}
      STORAGE_MAX_PROJECT_SUBMISSION_BYTES: ${STORAGE_MAX_PROJECT_SUBMISSION_BYTES:-104857600}
      STORAGE_ROOT: /app/uploads

    volumes:
      - backend_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      vault-agent:
        condition: service_healthy

    networks:
      - backend_ingress
      - backend_database
      - backend_vault
      - backend_egress

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile

    container_name: team-platform-frontend
    restart: unless-stopped

    volumes:
      - ./fe:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

    networks:
      - frontend_ingress

  waf:
    image: owasp/modsecurity-crs:4.25.2-nginx-202611190211-lts@sha256:98d448750b86f5f94ca570590dd1461e3ab24efc97e7c41b271a55ac33b331fe
    container_name: team-platform-waf
    restart: unless-stopped

    ports:
      - "${WAF_BIND_ADDRESS:-127.0.0.1}:${WAF_HTTP_PORT:-8080}:8080"

    env_file:
      - ./waf/modsecurity.env

    environment:
      PORT: "8080"
      SERVER_NAME: ${WAF_SERVER_NAME:-localhost}
      CLIENT_BODY_TIMEOUT: "60s"
      PROXY_TIMEOUT: "300s"

    volumes:
      - ./waf/nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/nginx/00-connection-map.conf.template:/etc/nginx/templates/conf.d/00-connection-map.conf.template:ro
      - ./waf/nginx/proxy-headers.conf.template:/etc/nginx/templates/includes/proxy-headers.conf.template:ro
      - ./waf/nginx/security-headers.conf.template:/etc/nginx/templates/includes/security-headers.conf.template:ro
      - ./waf/modsecurity-override.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro

    healthcheck:
      test: ["CMD", "curl", "--ipv4", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:
      - backend
      - frontend

    networks:
      - frontend_ingress
      - backend_ingress
      - waf_public

  vault:
    image: hashicorp/vault:2.2.2
    container_name: team-platform-vault
    restart: unless-stopped

    command: ["server"]
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true

    volumes:
      - vault_data:/vault/file
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro

    networks:
      - vault_private

  vault-init:
    image: hashicorp/vault:2.2.2
    container_name: team-platform-vault-init
    user: "0:0"
    restart: "no"

    entrypoint: ["/bin/sh", "-c"]
    command:
      - tr -d '\r' < /vault/auto-unseal.sh > /tmp/auto-unseal.sh && exec /bin/sh /tmp/auto-unseal.sh

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      VAULT_AGENT_UID: ${VAULT_AGENT_UID:-1000}
      VAULT_AGENT_GID: ${VAULT_AGENT_GID:-1000}

    volumes:
      - ./vault/auto-unseal.sh:/vault/auto-unseal.sh:ro
      - ./vault/policies/backend.hcl:/vault/policies/backend.hcl:ro
      - vault_credentials:/vault/credentials

    depends_on:
      - vault

    networks:
      - vault_private

  vault-agent:
    image: hashicorp/vault:2.2.2
    container_name: team-platform-vault-agent
    restart: unless-stopped

    user: "${VAULT_AGENT_UID:-1000}:${VAULT_AGENT_GID:-1000}"
    command: ["agent", "-config=/vault/config/agent.hcl"]
    security_opt:
      - no-new-privileges:true

    volumes:
      - ./vault/agent.hcl:/vault/config/agent.hcl:ro
      - vault_credentials:/vault/credentials:ro

    depends_on:
      vault-init:
        condition: service_completed_successfully

    networks:
      - backend_vault
      - vault_private

    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8100"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  vault_data:
  vault_credentials:
  backend_uploads:

networks:
  vault_private:
    internal: true
  backend_vault:
    internal: true
  backend_database:
    internal: true
  backend_ingress:
    internal: true
  frontend_ingress:
    internal: true
  backend_egress:
  waf_public: