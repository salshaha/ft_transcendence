services:
  postgres:
    image: postgres:17
    container_name: team-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/sql-schema.sql:/docker-entrypoint-initdb.d/init.sql

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile

    container_name: team-platform-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./fe:/app
      - /app/node_modules

    environment:
      NODE_ENV: development



volumes:
  postgres_data: